services:
  - type: web
    name: spark-kw-b96b327a-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend/a
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spark-kw-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GUARDIAN_CODE_PEPPER
        generateValue: true
      - key: RESPONSE_TOKEN_PEPPER
        generateValue: true
      - key: CORE_ENGINE_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://spark-kw.lovable.app

  - type: web
    name: spark-kw-b96b327a-core
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix core ci && npm --prefix backend/b ci --omit=dev
    startCommand: node core/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: BACKEND_A_BASE_URL
        value: https://spark-kw-b96b327a-api.onrender.com
      - key: BACKEND_A_CORE_TOKEN
        fromService:
          type: web
          name: spark-kw-b96b327a-api
          envVarKey: CORE_ENGINE_TOKEN
      - key: PUBLIC_RESPONSE_BASE_URL
        value: https://spark-kw.lovable.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CORE_HOST
        value: 0.0.0.0
      - key: CORE_CORS_ORIGINS
        value: https://spark-kw.lovable.app

databases:
  - name: spark-kw-db
    plan: free
    region: singapore
    databaseName: spark_kw
    user: spark_kw
